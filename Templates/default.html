<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' https: http:; base-uri 'none'; form-action 'none'">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main><article>
        <h1>{{ title }}</h1>
        {{ if date != "" }}<time datetime="{{ date }}">{{ date }}</time>{{ end }}
        <ul class="tags">{{ for tag in tags }}<li>{{ tag }}</li>{{ end }}</ul>
        <div class="content">{{ content }}</div>
    </article></main>
</body>
</html>
